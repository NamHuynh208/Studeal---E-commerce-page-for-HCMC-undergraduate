<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Studeal – sàn mua bán giáo trình và đồ cũ sinh viên TP.HCM">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="48%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.15" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
