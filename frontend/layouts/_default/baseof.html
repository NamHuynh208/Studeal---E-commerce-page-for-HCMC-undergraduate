<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "vi" }}" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>document.documentElement.classList.add('js');</script>
  {{ partial "seo.html" . }}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="{{ "images/favicon.svg" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "images/favicon.svg" | relURL }}">

  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e'
            },
            ink: '#0b1220'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            soft: '0 24px 60px -28px rgba(2, 132, 199, 0.35)',
            card: '0 18px 40px -24px rgba(15, 23, 42, 0.28)'
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ "css/studeal.css" | relURL }}">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-[#f7fbfe] font-sans text-slate-700 antialiased selection:bg-sky-200 selection:text-sky-950">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-sky-600 focus:px-5 focus:py-3 focus:text-sm focus:font-bold focus:text-white">
    Bỏ qua điều hướng
  </a>

  {{ partial "header.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <div x-data="{ show: false }" @scroll.window.throttle.200ms="show = window.scrollY > 700" x-cloak>
    <a x-show="show" x-transition.opacity.duration.300ms href="#main"
       class="fixed bottom-6 right-6 z-40 flex h-12 w-12 items-center justify-center rounded-full bg-sky-600 text-white shadow-lg shadow-sky-600/30 transition hover:-translate-y-1 hover:bg-sky-700"
       aria-label="Lên đầu trang">
      <i class="fa-solid fa-arrow-up"></i>
    </a>
  </div>

  <script src="{{ "js/studeal.js" | relURL }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
