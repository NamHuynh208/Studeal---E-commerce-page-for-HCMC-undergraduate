<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "vi" }}" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" data-theme-color>
  <!-- Chọn giao diện sáng/tối trước khi vẽ trang để không bị nháy -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      var saved = '';
      try {
        saved = localStorage.getItem('studeal_theme') || '';
        if (localStorage.getItem('studeal_token')) root.classList.add('has-session');
      } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.classList.toggle('dark', dark);
    })();
  </script>
  {{ partial "seo.html" . }}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="48x48" href="{{ "images/favicon.png" | relURL }}">
  <link rel="icon" href="{{ "favicon.ico" | relURL }}?v=20261026">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "images/apple-touch-icon.png" | relURL }}">

  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    // Màu trung tính, trắng và các sắc sky nhạt đi qua biến CSS (xem studeal.css) để đổi sáng/tối một chỗ.
    (function () {
      var v = function (name) { return 'rgb(var(--' + name + ') / <alpha-value>)'; };
      var slate = {};
      [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950].forEach(function (n) { slate[n] = v('slate-' + n); });
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              white: v('c-white'),
              ink: v('c-ink'),
              page: v('c-page'),
              slate: slate,
              sky: { 50: v('sky-50'), 100: v('sky-100'), 200: v('sky-200') },
              brand: {
                50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8',
                500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e'
              }
            },
            fontFamily: {
              sans: ['"SF Pro Display"', '"SF Pro Text"', '-apple-system', 'BlinkMacSystemFont', '"Be Vietnam Pro"', 'system-ui', 'sans-serif']
            },
            // Tiêu đề kiểu Apple dùng semibold, không dùng nét quá đậm
            fontWeight: { bold: '600', extrabold: '700' },
            letterSpacing: { tight: '-0.022em', tighter: '-0.035em' },
            boxShadow: {
              sm: '0 1px 2px rgb(0 0 0 / 0.05)',
              DEFAULT: '0 2px 8px -2px rgb(0 0 0 / 0.08)',
              md: '0 6px 16px -6px rgb(0 0 0 / 0.1)',
              lg: '0 12px 28px -10px rgb(0 0 0 / 0.14)',
              xl: '0 20px 44px -16px rgb(0 0 0 / 0.18)',
              '2xl': '0 32px 70px -24px rgb(0 0 0 / 0.28)',
              soft: '0 20px 44px -18px rgb(0 0 0 / 0.16)',
              card: '0 2px 10px -4px rgb(0 0 0 / 0.08)'
            }
          }
        }
      };
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ "css/studeal.css" | relURL }}?v=3011">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="bg-page font-sans text-slate-600 antialiased">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-sky-600 focus:px-5 focus:py-3 focus:text-sm focus:font-bold focus:text-white">
    Bỏ qua điều hướng
  </a>

  {{ partial "header.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <div x-data="{ show: false }" @scroll.window.throttle.200ms="show = window.scrollY > 900" x-cloak>
    <a x-show="show" x-transition.opacity.duration.300ms href="#main"
       class="glass fixed bottom-5 right-5 z-40 flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 text-slate-700 shadow-lg transition hover:-translate-y-0.5 hover:text-sky-600"
       aria-label="Lên đầu trang">
      <i class="fa-solid fa-arrow-up text-sm"></i>
    </a>
  </div>

  <script src="{{ "js/studeal.js" | relURL }}?v=3011" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
