{{- $p := .p -}}
{{- $i := .i -}}
<article x-show="filter === 'all' || filter === '{{ $p.category_slug }}'"
         x-transition.opacity.duration.200ms
         data-reveal style="transition-delay: {{ mul $i 50 }}ms"
         class="group relative flex h-full flex-col overflow-hidden border border-sky-100/80 bg-white shadow-card transition-all duration-300 hover:-translate-y-1.5 hover:border-sky-200 hover:shadow-soft">
  <a href="{{ site.Params.demoURL | relURL }}" class="relative block aspect-[4/3] overflow-hidden bg-sky-50" aria-label="Xem {{ $p.name }} trong chợ">
    <img src="{{ $p.image }}" alt="{{ $p.alt }}" loading="lazy" width="900" height="675"
         class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105">

    {{ if $p.vip }}
    <span class="absolute left-3 top-3 inline-flex items-center gap-1.5 bg-amber-400 px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-wide text-amber-950 shadow-lg shadow-amber-500/20">
      <i class="fa-solid fa-bolt text-[9px]"></i> VIP
    </span>
    {{ end }}

    <span class="absolute bottom-3 left-3 bg-white/90 px-2.5 py-1 text-[10px] font-bold text-sky-700 backdrop-blur">
      {{ $p.category }}
    </span>
    <span class="absolute bottom-3 right-3 bg-slate-950/55 px-2.5 py-1 text-[10px] font-semibold text-white backdrop-blur">
      {{ $p.condition }}
    </span>
  </a>

  <div class="flex flex-1 flex-col p-5">
    <div class="flex items-center gap-1.5 text-[11px] font-semibold text-sky-600">
      <i class="fa-solid fa-graduation-cap"></i>
      {{ $p.school }}
      <i class="fa-solid fa-circle-check ml-0.5 text-[10px] text-emerald-500" title="Đã xác thực .edu.vn"></i>
    </div>
    <h3 class="mt-2 line-clamp-2 min-h-[2.75rem] text-[15px] font-bold leading-snug text-ink">
      <a href="{{ site.Params.demoURL | relURL }}" class="transition-colors hover:text-sky-700">{{ $p.name }}</a>
    </h3>
    <div class="mt-3 flex items-end gap-2">
      <span class="text-xl font-extrabold tracking-tight text-sky-700">{{ $p.price }}</span>
      <span class="pb-0.5 text-xs font-medium text-slate-400 line-through">{{ $p.original }}</span>
    </div>
    <div class="mt-4 flex items-center justify-between border-t border-slate-100 pt-3">
      <span class="inline-flex items-center gap-1.5 text-[11px] font-medium text-slate-500">
        <i class="fa-regular fa-user text-sky-400"></i>
        {{ $p.seller }}
      </span>
      <a href="{{ site.Params.demoURL | relURL }}"
         class="inline-flex h-8 w-8 items-center justify-center bg-sky-50 text-sky-600 transition-all duration-300 group-hover:bg-sky-600 group-hover:text-white"
         aria-label="Mở {{ $p.name }} trong chợ">
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
    </div>
  </div>
</article>
